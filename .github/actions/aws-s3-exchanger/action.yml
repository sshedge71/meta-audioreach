name: AWS S3 Helper
description: Upload and download files from AWS S3

inputs:
  s3_bucket:
    description: S3 Bucket Name
    required: true
  local_file:
    description: Local file paths
    required: false
    default: ../artifacts/file_list.txt
  download_file:
    description: Download file paths
    required: false
    default: ''
  mode:
    description: Mode of operation (upload/download)
    required: true
    default: single-upload
  machine:
    description: Yocto MACHINE name; part of the multi-upload artifact name
    required: false
    default: ''
  build_type:
    description: Build type (flat_build or sdk_build); part of the multi-upload artifact name
    required: false
    default: ''
  artifact_key_basename:
    description: KAS file basename without extension; part of the multi-upload artifact name
    required: false
    default: ''

outputs:
  presigned_url:
    description: Pre-signed URL for the uploaded file
    value: ${{ steps.sync-data.outputs.presigned_url }}

runs:
  using: "composite"
  steps:
    - name: Sync Data
      id: sync-data
      shell: bash
      env:
        UPLOAD_LOCATION: ${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.workflow }}/
        INPUTS_MODE: ${{ inputs.mode }}
        INPUTS_S3_BUCKET: ${{ inputs.s3_bucket }}
        INPUTS_LOCAL_FILE: ${{ inputs.local_file }}
        INPUTS_DOWNLOAD_FILE: ${{ inputs.download_file }}
      run: |
        echo "::group::$(printf '__________ %-100s' 'Process' | tr ' ' _)"
        case "${INPUTS_MODE}" in
          multi-upload)
            echo "Uploading files to S3 bucket..."
            first_line=true
            # Start the JSON object
            echo "{" > "${GITHUB_WORKSPACE}/presigned_urls.json"
            while IFS= read -r file; do
              if [ -f "$file" ]; then
                echo "Uploading $file..."
                aws s3 cp "$file" s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}
                echo "Uploaded $file to s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}"
                echo "Creating Pre-signed URL for $file..."
                filename=$(basename "$file")
                presigned_url="$(aws s3 presign s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}$filename --expires-in 36000)"
                if [ "$first_line" = true ]; then
                  first_line=false
                else
                  echo "," >> "${GITHUB_WORKSPACE}/presigned_urls.json"
                fi
                # Append the pre-signed URL to the file
                echo " \"${filename}\": \"${presigned_url}\"" >> "${GITHUB_WORKSPACE}/presigned_urls.json"
                echo "Pre-signed URL for $file: $presigned_url"
              else
                echo "Warning: $file does not exist or is not a regular file."
              fi
            done < "${INPUTS_LOCAL_FILE}"
            # Close the JSON object
            echo "}" >> "${GITHUB_WORKSPACE}/presigned_urls.json"
            ;;
          single-upload)
            echo "Uploading single file to S3 bucket..."
            aws s3 cp "${INPUTS_LOCAL_FILE}" s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}
            echo "Uploaded ${INPUTS_LOCAL_FILE} to s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}"
            filename=$(basename "${INPUTS_LOCAL_FILE}")
            echo "Creating Pre-signed URL for ${INPUTS_LOCAL_FILE}..."
            presigned_url="$(aws s3 presign s3://${INPUTS_S3_BUCKET}/${UPLOAD_LOCATION}${filename} --expires-in 36000)"
            echo "presigned_url=${presigned_url}" >> "$GITHUB_OUTPUT"
            ;;
          download)
            #Download The required file from s3
            echo "Downloading files from S3 bucket..."
            aws s3 cp s3://${INPUTS_S3_BUCKET}/${INPUTS_DOWNLOAD_FILE} .
            ;;
          *)
            echo "Invalid mode. Use 'multi-upload', 'single-upload', or 'download'."
            exit 1
            ;;
        esac

    # 🔧 Minimal addition: ensure the uploaded artifact file name matches the artifact name
    - name: Prepare artifact file with expected name
      id: prepare
      if: ${{ inputs.mode == 'multi-upload' }}
      shell: bash
      env:
        MACHINE: ${{ inputs.machine }}
        BUILD_TYPE: ${{ inputs.build_type }}
        ARTIFACT_KEY_BASENAME: ${{ inputs.artifact_key_basename }}
      run: |
        set -euo pipefail
        # Fail loudly rather than producing a name with a doubled underscore,
        # which the Process URLs downloader would then never find.
        : "${MACHINE:?multi-upload requires the machine input}"
        : "${BUILD_TYPE:?multi-upload requires the build_type input}"
        : "${ARTIFACT_KEY_BASENAME:?multi-upload requires the artifact_key_basename input}"
        EXPECTED_NAME="${MACHINE}_${BUILD_TYPE}_${ARTIFACT_KEY_BASENAME}_presigned_urls.json"
        SRC="${GITHUB_WORKSPACE}/presigned_urls.json"
        DST="${GITHUB_WORKSPACE}/${EXPECTED_NAME}"
        cp -f "$SRC" "$DST"
        {
          echo "artifact_name=${EXPECTED_NAME}"
          echo "artifact_json_path=${DST}"
        } >> "$GITHUB_OUTPUT"
        echo "Prepared artifact JSON: $DST"

    - name: Upload artifacts
      if: ${{ inputs.mode == 'multi-upload' }}
      uses: actions/upload-artifact@v4
      with:
        # artifact_key_basename matches the downloader (Process URLs) expectation
        name: ${{ steps.prepare.outputs.artifact_name }}
        path: ${{ steps.prepare.outputs.artifact_json_path }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
