---
name: Build
description: Build the project using a Docker container
inputs:
  docker_image:
    description: Docker image to use for the build job
    required: true
  kas_file:
    description: KAS file to use for the build job
    required: true
  machine_name:
    description: Yocto MACHINE name to use for artifact paths
    required: true
  image_name:
    description: Yocto image name to use for artifact paths
    required: true
  build_command:
    description: Command to run for the build
    required: false
    default: "bitbake qcom-multimedia-proprietary-image"
  build_type:
    description: Type of build to perform (flat_build or sdk_build)
    required: false
    default: "flat_build"
  build_matrix:
    description: Build matrix containing configuration
    required: true
  docker_cpus:
    description: CPU quota for docker build container
    required: false
    default: "48"
  docker_memory:
    description: Memory limit for docker build container
    required: false
    default: "96g"
  bitbake_threads:
    description: BB_NUMBER_THREADS value used during builds
    required: false
    default: "24"
  parallel_make:
    description: "PARALLEL_MAKE value used during builds (example: -j24)"
    required: false
    default: "-j24"

runs:
  using: "composite"
  steps:
    - name: Initialize env (MACHINE, file list)
      shell: bash
      run: |
        #!/bin/bash
        set -e
        echo "MACHINE=${INPUTS_MACHINE_NAME}" >> $GITHUB_ENV
        KAS_BASE="$(basename "${INPUTS_KAS_FILE}")"
        ARTIFACT_KEY="${KAS_BASE%.*}"
        echo "ARTIFACT_KEY=${ARTIFACT_KEY}" >> $GITHUB_ENV
        echo "ARTIFACT_KEY_BASENAME=${ARTIFACT_KEY}" >> $GITHUB_ENV
        filepath="${{ github.workspace }}/${INPUTS_MACHINE_NAME}_${INPUTS_BUILD_TYPE}_${ARTIFACT_KEY}_file_list.txt"
        echo "filepath=${filepath}" >> $GITHUB_ENV
        : > "$filepath"
      env:
        INPUTS_MACHINE_NAME: ${{ inputs.machine_name }}
        INPUTS_KAS_FILE: ${{ inputs.kas_file }}
        INPUTS_BUILD_TYPE: ${{ inputs.build_type }}

    - name: Build ${{ env.MACHINE }}
      shell: bash
      run: |
        #!/bin/bash
        set -e
        filepath="${{ github.workspace }}/${MACHINE}_${INPUTS_BUILD_TYPE}_${ARTIFACT_KEY}_file_list.txt"
        echo "filepath=${filepath}" >> $GITHUB_ENV
        touch $filepath
        USER_ID=$(id -u)
        GROUP_ID=$(id -g)
        USER=$(whoami)
        WORKSPACE=${{ github.workspace }}/..
        USER_HOME="/home/$USER"
        echo "::group::$(printf '__________ %-100s' 'build' | tr ' ' _)"
        docker run \
          --rm \
          --user $(id -u):$(id -g) \
          -v ${WORKSPACE}:${USER_HOME}/workspace \
          -w ${USER_HOME}/workspace \
          --privileged \
          --cpus=${INPUTS_DOCKER_CPUS} \
          --memory=${INPUTS_DOCKER_MEMORY} \
          --ulimit nofile=1048576:1048576 \
          ${INPUTS_DOCKER_IMAGE} \
          bash -c "
            set -e
            kas shell ${INPUTS_KAS_FILE} -c '
              umask 022
              export BB_NUMBER_THREADS=\"${INPUTS_BITBAKE_THREADS}\"
              export PARALLEL_MAKE=\"${INPUTS_PARALLEL_MAKE}\"
              export CARGO_BUILD_JOBS=\"${INPUTS_BITBAKE_THREADS}\"
              ${INPUTS_BUILD_COMMAND}
            '
          "
        echo "::endgroup::"
      env:
        INPUTS_BUILD_TYPE: ${{ inputs.build_type }}
        INPUTS_DOCKER_CPUS: ${{ inputs.docker_cpus }}
        INPUTS_DOCKER_MEMORY: ${{ inputs.docker_memory }}
        INPUTS_DOCKER_IMAGE: ${{ inputs.docker_image }}
        INPUTS_KAS_FILE: ${{ inputs.kas_file }}
        INPUTS_BITBAKE_THREADS: ${{ inputs.bitbake_threads }}
        INPUTS_PARALLEL_MAKE: ${{ inputs.parallel_make }}
        INPUTS_BUILD_COMMAND: ${{ inputs.build_command }}

    - name: Create tar archive for the build
      if: ${{ inputs.build_type == 'flat_build' }}
      shell: bash
      run: |
        #!/bin/bash
        set -ex
        KAS_FILE="${INPUTS_KAS_FILE}"
        KAS_FILE="${KAS_FILE##*/}"
        KAS_FILE="${KAS_FILE%.*}"
        IMAGE_NAME="${INPUTS_IMAGE_NAME}"
        MACHINE=${MACHINE}
        
        cd ..
        BUILD_DIR=build
        PUB_DIR=${{ github.workspace }}/pub/${MACHINE}/flat_build
        mkdir -p "$PUB_DIR"
        
        cd "$BUILD_DIR/tmp/deploy/images/${IMAGE_NAME}"
        
        # Handle different image types
        if [ "$MACHINE" = "raspberrypi4" ]; then
          # For Raspberry Pi
          if [ -f "${IMAGE_NAME}-${MACHINE}.tar.bz2" ]; then
            cp "${IMAGE_NAME}-${MACHINE}.tar.bz2" "$PUB_DIR/${IMAGE_NAME}-${KAS_FILE}.tar.bz2"
            echo "${PUB_DIR}/${IMAGE_NAME}-${KAS_FILE}.tar.bz2" >> ${filepath}
          
          fi
        else
          # For QCOM devices
          
          cp "qcom-multimedia-proprietary-image-${IMAGE_NAME}.rootfs.qcomflash.tar.gz" "$PUB_DIR/qcom-multimedia-proprietary-image-${KAS_FILE}.rootfs.qcomflash.tar.gz"
          echo "${PUB_DIR}/qcom-multimedia-proprietary-image-${KAS_FILE}.rootfs.qcomflash.tar.gz" >> ${filepath}

        fi
        
        ls -larth "$PUB_DIR"
        echo "Build artifacts created in $PUB_DIR"
      env:
        INPUTS_KAS_FILE: ${{ inputs.kas_file }}
        INPUTS_IMAGE_NAME: ${{ inputs.image_name }}

    - name: copy the sdk to the pub directory
      if: ${{ inputs.build_type == 'sdk_build' }}
      shell: bash
      run: |
        #!/bin/bash
        set -ex
        KAS_FILE="${INPUTS_KAS_FILE}"
        KAS_FILE="${KAS_FILE##*/}"
        KAS_FILE="${KAS_FILE%.*}"
        MACHINE="${MACHINE}"
        
        cd ..
        cd build/tmp/deploy/sdk/
        
        # Handle different SDK patterns
        if [ "$MACHINE" = "raspberrypi4" ]; then
          # For Raspberry Pi
          sdk_file=$(ls poky-*.sh || ls core-image-*.sh)
        else
          # For QCOM devices
          sdk_file=$(ls qcom-distro-*.sh)
        fi
        
        # Check if SDK file was found
        if [ -z "$sdk_file" ]; then
          echo "Error: No SDK file found for $MACHINE"
          echo "Contents of sdk directory:"
          ls -la
          exit 1
        fi
        
        PUB_DIR=${{ github.workspace }}/pub/${MACHINE}/sdk_build
        mkdir -p $PUB_DIR
        cp $sdk_file $PUB_DIR/sdk-${KAS_FILE}.sh
        echo "${PUB_DIR}/sdk-${KAS_FILE}.sh" >> ${filepath}
        ls -larth $PUB_DIR
        echo "SDK artifacts created in $PUB_DIR"
      env:
        INPUTS_KAS_FILE: ${{ inputs.kas_file }}

    - name: Upload artifacts
      uses: Audioreach/meta-audioreach/.github/actions/aws-s3-exchanger@master
      with:
        mode: multi-upload
        local_file: ${{ env.filepath }}
        s3_bucket: qli-prd-audior-gh-artifacts
      env:
        MACHINE: ${{ env.MACHINE }}
        BUILD_TYPE: ${{ inputs.build_type }}
        ARTIFACT_KEY: ${{ env.ARTIFACT_KEY }}
        ARTIFACT_KEY_BASENAME: ${{ env.ARTIFACT_KEY_BASENAME }}

    - name: Update Summary
      shell: bash
      run: |
        echo "## Build Summary for ${MACHINE}" >> $GITHUB_STEP_SUMMARY
        echo '### :rocket: Build Successful!' >> $GITHUB_STEP_SUMMARY
        echo "- Machine: ${MACHINE}" >> $GITHUB_STEP_SUMMARY
        echo "- Image: ${INPUTS_IMAGE_NAME}" >> $GITHUB_STEP_SUMMARY
        echo "- Config File: ${INPUTS_KAS_FILE}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Type: ${INPUTS_BUILD_TYPE}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Command: ${INPUTS_BUILD_COMMAND}" >> $GITHUB_STEP_SUMMARY
      env:
        INPUTS_IMAGE_NAME: ${{ inputs.image_name }}
        INPUTS_KAS_FILE: ${{ inputs.kas_file }}
        INPUTS_BUILD_TYPE: ${{ inputs.build_type }}
        INPUTS_BUILD_COMMAND: ${{ inputs.build_command }}
